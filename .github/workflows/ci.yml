name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Quality gates (secrets, sensitive files, migrations, removed or focused tests, PR title)
        if: github.event_name == 'pull_request'
        env:
          NUVIO_BASE_REF: origin/${{ github.base_ref }}
          NUVIO_PR_TITLE: ${{ github.event.pull_request.title }}
          NUVIO_ALLOW_MIGRATION_EDITS: ${{ contains(github.event.pull_request.labels.*.name, 'migration-edit-approved') }}
          NUVIO_ALLOW_TEST_REMOVAL: ${{ contains(github.event.pull_request.labels.*.name, 'test-removal-approved') }}
        run: node tools/nuvio/cli.mjs gate --ci
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Automation tests
        run: pnpm test:automation
      - name: Build
        run: pnpm build
      - name: Dependency audit (critical)
        run: pnpm audit --prod --audit-level critical

  validate-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Bicep templates
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.prod.bicepparam --stdout > /dev/null
      - name: Validate workflow YAML syntax
        run: |
          for f in .github/workflows/*.yml; do npx -y js-yaml@4.3.2 "$f" > /dev/null; done
