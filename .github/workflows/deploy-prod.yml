name: Deploy production

# Despliegue MANUAL y PROTEGIDO (US-051).
# - Solo workflow_dispatch, solo desde main, sobre el Environment `production`
#   (que requiere aprobación humana una vez configurado: ver docs/architecture/deployment.md).
# - Inerte hasta activación: preflight falla si AZURE_DEPLOY_ENABLED != 'true'
#   o faltan las variables AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
# - Autenticación por OIDC (azure/login): sin secretos ni publish profiles.
# - Los tokens de despliegue de Static Web Apps se obtienen en el job con la
#   identidad OIDC, se enmascaran y viven solo durante la ejecución.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check deployment is enabled
        run: |
          if [ "${{ vars.AZURE_DEPLOY_ENABLED }}" != "true" ]; then
            echo "::error::Deployment is not enabled. Set repository variable AZURE_DEPLOY_ENABLED=true after completing docs/architecture/deployment.md."
            exit 1
          fi
      - name: Check required variables
        run: |
          for pair in "AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}" "AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" "AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ]; then
              echo "::error::Missing repository variable $name. See docs/architecture/deployment.md."
              exit 1
            fi
          done
      - name: Verify latest CI run succeeded on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '[.check_runs[] | select(.name == "verify")] | first.conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Latest CI 'verify' check-run on ${{ github.sha }} did not succeed (got: ${conclusion:-none})."
            exit 1
          fi
          echo "CI verify succeeded on this commit."

  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure (Bicep, subscription scope)
        run: |
          az deployment sub create \
            --name nuvio-infra-prod \
            --location brazilsouth \
            --template-file infra/main.bicep \
            --parameters infra/main.prod.bicepparam
      - name: Read deployment outputs
        id: outputs
        run: |
          for key in clientHostname adminHostname apiHostname clientSwaName adminSwaName apiAppName resourceGroupName; do
            value=$(az deployment sub show -n nuvio-infra-prod --query "properties.outputs.$key.value" -o tsv)
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Build apps
        env:
          VITE_API_URL: https://${{ steps.outputs.outputs.apiHostname }}
        run: pnpm build
      - name: Package API for deployment
        run: pnpm --filter @nuvio/api deploy --prod api-package
      - name: Deploy API to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.outputs.outputs.apiAppName }}
          package: api-package
          scm-do-build-during-deployment: false
          remote-build: false
          respect-funcignore: true
      - name: Deploy client Static Web App
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name ${{ steps.outputs.outputs.clientSwaName }} \
            --resource-group ${{ steps.outputs.outputs.resourceGroupName }} \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          SWA_CLI_DEPLOYMENT_TOKEN=$TOKEN npx -y @azure/static-web-apps-cli@2 deploy \
            apps/client/dist --deployment-environment production
      - name: Deploy admin Static Web App
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name ${{ steps.outputs.outputs.adminSwaName }} \
            --resource-group ${{ steps.outputs.outputs.resourceGroupName }} \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          SWA_CLI_DEPLOYMENT_TOKEN=$TOKEN npx -y @azure/static-web-apps-cli@2 deploy \
            apps/admin/dist --deployment-environment production
      - name: Health check API
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS "https://${{ steps.outputs.outputs.apiHostname }}/api/health" || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q '"status":"ok"' && exit 0
            sleep 15
          done
          echo "::error::API health check failed after deployment."
          exit 1
